version: '3.8'

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2019-latest
    container_name: desafio-sqlserver
    environment:
      SA_PASSWORD: "Your_password123"
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools/bin/sqlcmd -S localhost -U SA -P \"$SA_PASSWORD\" -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: DesafioTecnico/Dockerfile
    container_name: desafio-api
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=DesafioTecnicoDb;User Id=sa;Password=Your_password123;TrustServerCertificate=True;"
      Jwt__Key: "REPLACE_WITH_SECURE_KEY_CHANGE_IN_PROD"
      Jwt__Issuer: "DesafioTecnicoApi"
      Jwt__Audience: "DesafioTecnicoApiUsers"
    ports:
      - "5000:80"
    restart: unless-stopped
