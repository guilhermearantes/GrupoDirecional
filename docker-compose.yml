services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2019-latest
    container_name: desafio-sqlserver
    environment:
      SA_PASSWORD: "${SA_PASSWORD:-Grup0D!reCional2026}"
      ACCEPT_EULA: "Y"
    ports:
      - "${DB_PORT:-14333}:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools/bin/sqlcmd -S localhost -U SA -P \"$SA_PASSWORD\" -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: DesafioTecnico/Dockerfile
    container_name: desafio-api
    depends_on:
      migrations:
        condition: service_completed_successfully
    environment:
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=DesafioTecnicoDb;User Id=sa;Password=${SA_PASSWORD:-Grup0D!reCional2026};TrustServerCertificate=True;"
      Jwt__Key: "${JWT__KEY:-very_secret_key_replace_this_long_enough_to_be_secure_and_at_least_32_chars}"
      Jwt__Issuer: "${JWT__ISSUER:-DesafioTecnicoApi}"
      Jwt__Audience: "${JWT__AUDIENCE:-DesafioTecnicoApiUsers}"
      Jwt__ExpiryMinutes: "${JWT__EXPIRY_MINUTES:-60}"
    ports:
      - "8080:8080"
    restart: unless-stopped

  migrations:
    image: mcr.microsoft.com/dotnet/sdk:9.0
    container_name: desafio-migrations
    depends_on:
      sqlserver:
        condition: service_healthy
    volumes:
      - ./:/src
    working_dir: /src/DesafioTecnico
    command: ["/bin/bash", "-lc", "./scripts/run-migrations.sh"]
    environment:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=DesafioTecnicoDb;User Id=sa;Password=${SA_PASSWORD:-Grup0D!reCional2026};TrustServerCertificate=True;"
      Jwt__Key: "${JWT__KEY:-very_secret_key_replace_this_long_enough_to_be_secure_and_at_least_32_chars}"
    restart: "no"
